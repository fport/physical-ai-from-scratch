# Lesson 15 · Safety. Every answer is supported by the lesson page,
# experiments/15-safety/output.txt or build_output.txt. answer = index of the correct option (0-based).
- stage: pre
  q:
    en: You cap a joint's motor torque. Which harm does the cap bound directly?
    tr: Bir eklemin motor torkuna cap koyuyorsun. Cap hangi zararı doğrudan sınırlar?
  options:
    - en: Both the impact and the push, equally; force is torque over lever either way.
      tr: Çarpmayı da itmeyi de eşit şekilde; kuvvet her durumda tork bölü kaldıraçtır.
    - en: The steady push on an obstacle; the impact only indirectly, through a slower arrival.
      tr: Engele kalıcı itmeyi; çarpmayı yalnızca dolaylı olarak, daha yavaş gelişle.
    - en: Only the impact; once the arm stalls the cap no longer matters.
      tr: Yalnızca çarpmayı; kol takılınca cap'in önemi kalmaz.
  answer: 1
  why:
    en: At rest the push is $F = \tau_{\max}/r$; the impact depends on the arrival speed. Part A - a 0.5 N·m cap gives a 2.12 N push but still a 21.34 N peak.
    tr: Durgun hâlde itme $F = \tau_{\max}/r$'dir; çarpma geliş hızına bağlıdır. A bölümü - 0,5 N·m cap 2,12 N itme ama yine de 21,34 N tepe veriyor.
- stage: pre
  q:
    en: An operator jogs a joint with velocity commands, then the messages stop arriving. With no watchdog, what does the arm do?
    tr: Bir operatör bir eklemi hız komutlarıyla jog ediyor, sonra mesajlar gelmez oluyor. Watchdog yoksa kol ne yapar?
  options:
    - en: It keeps moving at the last commanded velocity until something stops it.
      tr: Bir şey onu durdurana kadar son komut edilen hızla hareket etmeye devam eder.
    - en: It holds its last position, like a position servo with no new goal.
      tr: Yeni hedef almayan bir position servo gibi son pozisyonunu tutar.
    - en: It drops, because the servo turns its torque off.
      tr: Düşer, çünkü servo torkunu kapatır.
  answer: 0
  why:
    en: '"Stop" depends on the interface (Core idea). In part D, with no watchdog the arm travels 19.57° after the last message and hits the post with 24.48 N.'
    tr: '"Dur" arayüze bağlıdır (Ana fikir). D bölümünde watchdog yokken kol son mesajdan sonra 19,57° gidiyor ve direğe 24,48 N ile çarpıyor.'
- stage: check
  q:
    en: In Build it, Step 2, the SO-101 servo ($k_p$ = 998.22) hits its 2.94 N·m cap at an error of 2.95 mrad. What follows for a bad command?
    tr: Sıfırdan yaz, Adım 2'de SO-101 servo'su ($k_p$ = 998,22) 2,94 N·m'lik cap'ine 2,95 mrad hatada ulaşıyor. Hatalı bir komut için bundan ne çıkar?
  options:
    - en: The servo pushes in proportion to the error, so a larger bad command pushes harder.
      tr: Servo hatayla orantılı iter, yani daha büyük bir hatalı komut daha sert iter.
    - en: Lowering $k_p$ is the best way to bound the push.
      tr: İtmeyi sınırlamanın en iyi yolu $k_p$'yi düşürmektir.
    - en: Almost any bad command saturates the servo, so the cap, not the gains, sets the push.
      tr: Neredeyse her hatalı komut servo'yu saturation'a sokar; itmeyi gain'ler değil cap belirler.
  answer: 2
  why:
    en: Step 2 matches MuJoCo's actuator to 2.3e-13 N·m and shows the 2.95 mrad threshold; Step 3 then measures pushes that follow the cap (2.12 N at 0.5 N·m, 4.34 N at 1.0 N·m).
    tr: Adım 2 MuJoCo'nun actuator'ıyla 2,3e-13 N·m'ye kadar örtüşüyor ve 2,95 mrad eşiğini gösteriyor; Adım 3 de cap'i izleyen itmeler ölçüyor (0,5 N·m'de 2,12 N, 1,0 N·m'de 4,34 N).
- stage: check
  q:
    en: With LeRobot's default SO-101 follower settings you set `max_relative_target = 0.02`. What does it limit?
    tr: LeRobot'un varsayılan SO-101 follower ayarlarıyla `max_relative_target = 0.02` yapıyorsun. Neyi sınırlar?
  options:
    - en: Each body joint's goal to 0.02 rad from the last command.
      tr: Her gövde ekleminin hedefini son komuttan 0,02 rad uzağa.
    - en: Each body joint's goal to 0.02° from the present position.
      tr: Her gövde ekleminin hedefini mevcut pozisyondan 0,02° uzağa.
    - en: The joint speed to 0.02 rad/s.
      tr: Eklem hızını 0,02 rad/s'ye.
  answer: 1
  why:
    en: Use it, traps - the follower uses degrees by default (`use_degrees = True`), and `ensure_safe_goal_position` clamps against `Present_Position`, like `clamp_goal`.
    tr: Kütüphaneyle kullan, tuzaklar - follower varsayılan olarak derece kullanır (`use_degrees = True`) ve `ensure_safe_goal_position`, `clamp_goal` gibi mevcut pozisyona (`Present_Position`) göre kırpar.
- stage: post
  q:
    en: A tight relative-target limit (δ = 0.005 rad/tick) cuts the impact on the post to 17.17 N. Why does the arm still push on it with 13.54 N afterwards?
    tr: Sıkı bir relative-target limit (δ = 0,005 rad/tick) direğe çarpmayı 17,17 N'ye indiriyor. Kol neden sonrasında yine de 13,54 N ile itmeye devam ediyor?
  options:
    - en: Once the arm stalls, the goal stays δ ahead and $k_p\delta$ (about 5 N·m) is above the 2.94 N·m cap, so the servo pushes at its cap.
      tr: Kol durunca hedef δ kadar önde kalıyor ve $k_p\delta$ (yaklaşık 5 N·m) 2,94 N·m'lik cap'in üstünde; servo cap'inde itiyor.
    - en: The rate limit only applies while the arm is moving freely.
      tr: Rate limit yalnızca kol serbestçe hareket ederken geçerli.
    - en: Gravity pulls the arm into the post.
      tr: Yerçekimi kolu direğe doğru çekiyor.
  answer: 0
  why:
    en: Part C - the steady push stays near 14 N for every δ (998.22 × 0.005 ≈ 5 N·m ≥ 2.94 N·m). A rate limit bounds the speed at impact, not the push.
    tr: C bölümü - kalıcı itme her δ için 14 N civarında kalıyor (998,22 × 0,005 ≈ 5 N·m ≥ 2,94 N·m). Rate limit itmeyi değil, çarpma anındaki hızı sınırlar.
- stage: post
  q:
    en: A watchdog with a 0.5 s timeout guards a 1 rad/s jog, but the arm still hits the post. Why?
    tr: 0,5 s timeout'lu bir watchdog 1 rad/s'lik bir jog'u koruyor ama kol yine de direğe çarpıyor. Neden?
  options:
    - en: The watchdog turns the torque off, so the arm falls into the post.
      tr: Watchdog torku kesiyor, kol da direğe düşüyor.
    - en: Watchdogs only work with position commands.
      tr: Watchdog'lar yalnızca position komutlarıyla çalışır.
    - en: The arm reaches the post 0.350 s after the last message, before the timeout fires.
      tr: Kol son mesajdan 0,350 s sonra direğe ulaşıyor, timeout tetiklenmeden önce.
  answer: 2
  why:
    en: Part D - a watchdog helps only if it fires before the arm can reach anything; 0.2 s and shorter avoided the post (0.00 N), 0.5 s and 1 s gave 24.48 N.
    tr: D bölümü - watchdog ancak kol bir şeye ulaşmadan tetiklenirse işe yarar; 0,2 s ve daha kısası direkten kaçındı (0,00 N), 0,5 s ve 1 s 24,48 N verdi.
