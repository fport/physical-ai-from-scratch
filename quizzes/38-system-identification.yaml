# Lesson 38 · System identification. Every answer is supported by the lesson page or
# experiments/38-system-identification/output.txt. answer = index of the correct option (0-based).
- q:
    en: In part A, a 0.1 rad multisine brings the validation error from 9.54 to 0.09 mrad, but a 0.4 rad multisine only to 6.67 mrad. Why does the larger excitation fit worse?
    tr: A bölümünde 0,1 rad'lık bir multisine validation hatasını 9,54'ten 0,09 mrad'a indiriyor, 0,4 rad'lık multisine ise yalnızca 6,67 mrad'a. Daha büyük excitation neden daha kötü fit veriyor?
  options:
    - en: Larger motions have relatively more measurement noise.
      tr: Daha büyük hareketlerde ölçüm gürültüsü oransal olarak daha fazladır.
    - en: Some servo is at its torque limit in every step, so its torque no longer depends on the servo gain or the damping and the data cannot pin them.
      tr: Her adımda bir servo torque sınırında; torque'u artık servo gain'ine ya da damping'e bağlı değil ve veri bunları sabitleyemiyor.
    - en: The optimizer runs out of function evaluations on longer trajectories.
      tr: Optimizer daha uzun trajectory'lerde fonksiyon değerlendirmelerini tüketir.
  answer: 1
  why:
    en: Part A table, `sat` 4.6% at 0.1 rad and 100.0% at 0.4 rad. Excitation has a window between noise (0.005 rad) and saturation.
    tr: A bölümü tablosu, `sat` 0,1 rad'da %4,6, 0,4 rad'da %100,0. Excitation'ın gürültü (0,005 rad) ile saturation arasında bir penceresi var.
- q:
    en: With 30 mrad of noise the fitted mass is off by −81.4%, yet the validation error is only 1.49 mrad. How can both be true?
    tr: 30 mrad gürültüyle fit edilen kütle −%81,4 hatalı, ama validation hatası yalnızca 1,49 mrad. İkisi nasıl birlikte doğru olabilir?
  options:
    - en: Some parameter combinations barely change the output; the data cannot pin them, and for prediction they hardly matter.
      tr: Bazı parametre kombinasyonları çıktıyı neredeyse değiştirmez; veri onları sabitleyemez ve tahmin için pek önemli değillerdir.
    - en: The validation trajectory happens to be too short to show the mass.
      tr: Validation trajectory'si tesadüfen kütleyi gösteremeyecek kadar kısa.
    - en: The fit diverged, and 1.49 mrad is the nominal model's error.
      tr: Fit ıraksadı ve 1,49 mrad nominal modelin hatası.
  answer: 0
  why:
    en: Part B. Parameter error and prediction error are different things (a "sloppy" direction); the nominal model's validation error is 9.54 mrad, six times worse.
    tr: B bölümü. Parametre hatası ile tahmin hatası farklı şeylerdir ("sloppy" bir yön); nominal modelin validation hatası 9,54 mrad, altı kat daha kötü.
- q:
    en: The fit without a delay parameter returns kp scale 0.226 (real 0.700), damping 1.268 (real 0.900) and mass scale 0.591 (real 1.200). What happened?
    tr: Delay parametresi olmayan fit kp scale 0,226 (gerçek 0,700), damping 1,268 (gerçek 0,900) ve mass scale 0,591 (gerçek 1,200) döndürüyor. Ne oldu?
  options:
    - en: Only the kp scale is wrong; the other parameters are close enough.
      tr: Yalnızca kp scale yanlış; diğer parametreler yeterince yakın.
    - en: The noise was too large for the fit to converge.
      tr: Gürültü, fit'in yakınsaması için fazla büyüktü.
    - en: The model cannot represent the 15 ms delay, so it fakes the lag with a soft, overdamped, light servo and every parameter is biased.
      tr: Model 15 ms'lik gecikmeyi temsil edemiyor; gecikmeyi yumuşak, aşırı sönümlü, hafif bir servoyla taklit ediyor ve her parametre sapıyor.
  answer: 2
  why:
    en: Break it, no noise. Validation error 6.23 mrad, worse than the full model at 30 mrad of noise (1.49 mrad). Always include delay and check on data you did not fit.
    tr: Boz bölümü, gürültüsüz. Validation hatası 6,23 mrad; 30 mrad gürültüdeki tam modelden (1,49 mrad) daha kötü. Gecikmeyi her zaman ekleyin ve fit etmediğiniz veride kontrol edin.
