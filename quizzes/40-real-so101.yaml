# Lesson 40 · Deploying on the real SO-101 (hardware walkthrough; the tables come from the simulation preflight in
# experiments/40-real-so101/output.txt and build_output.txt). answer = index of the correct option (0-based).
- stage: pre
  q:
    en: A policy is trained on data recorded with one calibration and rolled out with another. What happens?
    tr: Bir policy, bir kalibrasyonla kaydedilmiş veride eğitiliyor ve başka bir kalibrasyonla rollout ediliyor. Ne olur?
  options:
    - en: LeRobot refuses to connect because the calibration files differ.
      tr: Kalibrasyon dosyaları farklı olduğu için LeRobot bağlanmayı reddeder.
    - en: Every goal is shifted by the difference between the two calibrations, and nothing in the software complains.
      tr: Her hedef iki kalibrasyon arasındaki fark kadar kayar ve yazılımda hiçbir şey şikâyet etmez.
    - en: The servos recalibrate themselves at connect, so nothing changes.
      tr: Servolar bağlanırken kendilerini yeniden kalibre eder, bu yüzden hiçbir şey değişmez.
  answer: 1
  why:
    en: The calibration is stored as `<id>.json` under the robot's `id`, so the same `id` must be used when teleoperating, recording and rolling out (The problem; pipeline table).
    tr: Kalibrasyon robotun `id`'si altında `<id>.json` olarak saklanır; teleoperation, kayıt ve rollout'ta aynı `id` kullanılmalı (Problem; pipeline tablosu).
- stage: pre
  q:
    en: Before replaying a trajectory on the arm, what can a simulation preflight check that the hardware cannot tell you safely?
    tr: Bir trajectory'yi kolda tekrar oynatmadan önce, bir simülasyon preflight'ı donanımın güvenle söyleyemeyeceği neyi kontrol edebilir?
  options:
    - en: Whether the real servos are warm enough.
      tr: Gerçek servoların yeterince ısınıp ısınmadığını.
    - en: Whether the camera is in focus.
      tr: Kameranın odakta olup olmadığını.
    - en: Range margins, goal steps per tick, static gravity torque against the servo limit and contacts, all before anything moves.
      tr: Range margin'lerini, tick başına hedef step'lerini, servo limitine karşı statik yerçekimi torkunu ve contact'ları; hepsini bir şey hareket etmeden.
  answer: 2
  why:
    en: Part 2's six checks run on the Menagerie model; the step check alone already rejects the ×2 playback (0.103 rad per tick).
    tr: Bölüm 2'nin altı kontrolü Menagerie modelinde çalışıyor; step kontrolü tek başına ×2 oynatmayı reddediyor (tick başına 0,103 rad).
- stage: check
  q:
    en: In Build it, Step 1, readings survive the ticks → degrees → ticks round trip exactly, but commanded goals come back up to 0.0878° low. Why low and not ± half a tick?
    tr: Sıfırdan yaz, Adım 1'de okumalar tick → derece → tick gidiş-dönüşünü birebir atlatıyor, ama komut edilen hedefler 0,0878°'ye kadar düşük dönüyor. Neden ± yarım tick değil de düşük?
  options:
    - en: LeRobot's _unnormalize uses int(), which rounds a positive tick count down.
      tr: LeRobot'un _unnormalize'ı int() kullanıyor; bu, pozitif bir tick sayısını aşağı yuvarlar.
    - en: The encoder has backlash.
      tr: Encoder'da boşluk var.
    - en: Degrees are converted with the calibrated range instead of the resolution.
      tr: Dereceler çözünürlük yerine kalibre edilmiş aralıkla çevriliyor.
  answer: 0
  why:
    en: One tick is 360/4095 = 0.0879°. Truncation gives a systematic offset of half a tick on average, not zero-mean noise.
    tr: Bir tick 360/4095 = 0,0879°. Kesme, sıfır ortalamalı bir noise değil, ortalamada yarım tick'lik sistematik bir ofset verir.
- stage: check
  q:
    en: Build it, Step 4 computes the payload budget from the Jacobian and finds 0.764 kg under the 80% rule. While writing it, why did the hand-computed torque disagree with the Experiment's first table B?
    tr: Sıfırdan yaz, Adım 4 yük bütçesini Jacobian'dan hesaplıyor ve %80 kuralıyla 0,764 kg buluyor. Bunu yazarken elle hesaplanan tork neden Deney'in ilk B tablosuyla uyuşmadı?
  options:
    - en: The Jacobian ignores the gripper joint.
      tr: Jacobian gripper joint'ini yok sayıyor.
    - en: The Experiment's payload body left its inertial position unset, so MuJoCo put the mass 9.8 cm beyond the gripper frame; with ipos set, both give 0.945 N·m at 0.2 kg.
      tr: Deney'in yük gövdesi inertial konumunu boş bırakmıştı, bu yüzden MuJoCo kütleyi gripper frame'in 9,8 cm ötesine koydu; ipos ayarlanınca ikisi de 0,2 kg'da 0,945 N·m veriyor.
    - en: qfrc_bias also contains the servo torque.
      tr: qfrc_bias servo torkunu da içerir.
  answer: 1
  why:
    en: The first run gave 1.096 N·m at 0.2 kg; the corrected table B now matches Step 4 at every payload (0.945, 1.445, 1.944, 2.443 N·m).
    tr: İlk koşu 0,2 kg'da 1,096 N·m veriyordu; düzeltilmiş B tablosu artık her yükte Adım 4 ile uyuşuyor (0,945, 1,445, 1,944, 2,443 N·m).
- stage: post
  q:
    en: In Break it, a 10° shoulder_lift offset drives the gripper into the floor (1521 steps of contact), yet the range check passes. Why?
    tr: Boz bölümünde 10°'lik bir shoulder_lift ofseti gripper'ı zemine sokuyor (1521 adım contact), ama range kontrolü geçiyor. Neden?
  options:
    - en: The range check is only applied to the gripper joint.
      tr: Range kontrolü yalnızca gripper joint'ine uygulanır.
    - en: Joint limits are not a model of the workspace; the goals stay inside the joint range while the arm reaches into the floor.
      tr: Joint limitleri çalışma alanının bir modeli değildir; kol zemine uzanırken hedefler joint aralığının içinde kalır.
    - en: An offset of 10° is below the 5° margin the check uses.
      tr: 10°'lik ofset, kontrolün kullandığı 5°'lik margin'in altındadır.
  answer: 1
  why:
    en: Break it table, range margin 10.00° in every row (the gripper's closed goal against its −10° limit). Only the contact and tracking checks catch it; the offset must be measured.
    tr: Boz tablosu, range margin'i her satırda 10,00° (gripper'ın kapalı hedefinin −10°'lik limitine uzaklığı). Bunu yalnızca contact ve takip kontrolleri yakalıyor; ofset ölçülmeli.
- stage: post
  q:
    en: With a 0.8 kg payload the arm still tracks to 0.71°, but the preflight says FAIL. What does the gravity check catch?
    tr: 0,8 kg yükle kol hâlâ 0,71°'ye kadar takip ediyor, ama preflight FAIL diyor. Gravity kontrolü neyi yakalıyor?
  options:
    - en: The servo would overheat after a few seconds.
      tr: Servo birkaç saniye sonra aşırı ısınırdı.
    - en: The tracking error is about to exceed 5°.
      tr: Takip hatası 5°'yi aşmak üzere.
    - en: The static gravity torque (2.443 N·m) is past 80% of the 2.94 N·m servo limit, a missing margin before the arm has to prove it.
      tr: Statik yerçekimi torku (2,443 N·m), 2,94 N·m'lik servo limitinin %80'ini aşıyor; kol bunu kanıtlamak zorunda kalmadan önce eksik bir margin.
  answer: 2
  why:
    en: 'Part B table: 0.6 kg passes at 1.944 N·m; the 80% line lies at 0.764 kg (Build it, Step 4) and the full limit at 0.999 kg.'
    tr: 'B tablosu: 0,6 kg 1,944 N·m ile geçiyor; %80 çizgisi 0,764 kg''da (Sıfırdan yaz, Adım 4), tam limit 0,999 kg''da.'
