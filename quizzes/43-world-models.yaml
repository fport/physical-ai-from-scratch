# Lesson 43 · World models. Every answer is supported by the lesson page or
# experiments/43-world-models/output.txt. answer = index of the correct option (0-based).
- q:
    en: Linearized, the rollout error obeys $e_{h+1} \approx (I + \partial f/\partial s)\, e_h + \epsilon_h$. Where does it grow geometrically?
    tr: Doğrusallaştırılınca rollout hatası $e_{h+1} \approx (I + \partial f/\partial s)\, e_h + \epsilon_h$ kuralına uyar. Nerede geometrik olarak büyür?
  options:
    - en: Near the hanging state, because the pendulum moves fastest there.
      tr: Asılı duruma yakın, çünkü sarkaç orada en hızlı hareket eder.
    - en: Everywhere equally; the growth depends only on the one-step error.
      tr: Her yerde eşit; büyüme yalnızca tek adım hatasına bağlıdır.
    - en: Near upright, where nearby states diverge and the bracket has an eigenvalue larger than 1 in magnitude.
      tr: Dik konuma yakın, komşu durumların birbirinden ayrıldığı ve parantezin mutlak değeri 1'den büyük bir özdeğeri olduğu yerde.
  answer: 2
  why:
    en: Math details, compounding error. Where the dynamics are stable the errors roughly add up; a test set with a few unstable trajectories gets a mean dominated by them (part A, mean 0.0966 vs median 0.0072 rad at 100 steps).
    tr: Math details, birikimli hata. Dinamik kararlıysa hatalar kabaca toplanır; birkaç kararsız trajectory içeren bir test setinde ortalamaya onlar hâkim olur (A bölümü, 100 adımda ortalama 0,0966, medyan 0,0072 rad).
- q:
    en: In part B both planners fail at H = 10 (0/3) and both succeed at H = 30 (3/3). What decides success here?
    tr: B bölümünde iki planner da H = 10'da başarısız (0/3), H = 30'da başarılı (3/3). Burada başarıyı ne belirliyor?
  options:
    - en: The planning horizon; 0.5 s is too short to see that pumping pays off, 1.5 s works for the learned and the true model alike.
      tr: Planlama ufku; 0,5 s pompalamanın işe yaradığını görmek için fazla kısa, 1,5 s hem öğrenilmiş hem gerçek model için çalışıyor.
    - en: The model; the learned one is too inaccurate for short horizons.
      tr: Model; öğrenilmiş olan kısa ufuklar için fazla isabetsiz.
    - en: The number of candidate sequences, which grows with H.
      tr: H ile birlikte büyüyen aday dizi sayısı.
  answer: 0
  why:
    en: Part B table. The learned model matches the true one within a step on the time to reach upright (67 vs 66 at H = 30); K = 100 in every row.
    tr: B tablosu. Öğrenilmiş model dik konuma ulaşma zamanında gerçeğiyle bir adım içinde eşleşiyor (H = 30'da 66'ya karşı 67); her satırda K = 100.
- q:
    en: A model trained only on low-energy data is about 90× worse for one step, yet MPC with it still swings up in 2 of 3 starts. Executing 5 actions open loop instead, the learned model drops to 2/3 while the true one keeps 3/3. What makes the imperfect model usable?
    tr: Yalnızca düşük enerjili veriyle eğitilmiş bir model tek adımda yaklaşık 90× daha kötü, ama onunla MPC yine de 3 başlangıçtan 2'sinde sarkacı kaldırıyor. Bunun yerine 5 action open loop çalıştırılınca öğrenilmiş model 2/3'e düşüyor, gerçek model 3/3'te kalıyor. Kusurlu modeli kullanılabilir yapan ne?
  options:
    - en: Training for more gradient steps.
      tr: Daha fazla gradient adımıyla eğitmek.
    - en: Replanning every 0.05 s from the measured state, which resets the drift before it matters.
      tr: Her 0,05 s'de ölçülen durumdan yeniden planlamak; bu, kayma önemli hâle gelmeden onu sıfırlar.
    - en: A longer open-loop execution, so the model sees more of its own predictions.
      tr: Modelin kendi tahminlerini daha çok görmesi için daha uzun open-loop yürütme.
  answer: 1
  why:
    en: Break it (parts C–E). One-step error 0.0371 vs 0.0004 rad; from k = 10 even the perfect model fails, so the replanning rate is the knob.
    tr: Boz bölümü (C–E). Tek adım hatası 0,0004'e karşı 0,0371 rad; k = 10'dan itibaren kusursuz model bile başarısız, yani ayar düğmesi yeniden planlama hızı.
