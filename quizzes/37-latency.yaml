# Lesson 37 · Latency. Every answer is supported by the lesson page or
# experiments/37-latency/output.txt. answer = index of the correct option (0-based).
- q:
    en: Overshoot is 4.45% without delay, 5.02% at 20 ms and 31.23% at 40 ms; at 50 ms the loop is unstable. Why does it fail so abruptly?
    tr: Overshoot gecikmesiz %4,45, 20 ms'de %5,02 ve 40 ms'de %31,23; 50 ms'de döngü kararsız. Neden bu kadar ani başarısız oluyor?
  options:
    - en: The delay removes phase $\omega_c d$ at the crossover; once that eats the 65.2° phase margin, at $d_{\max} = 49.5$ ms, corrections reinforce the error.
      tr: Gecikme crossover'da $\omega_c d$ kadar faz siler; bu 65,2°'lik phase margin'i yediğinde, $d_{\max} = 49{,}5$ ms'de, düzeltmeler hatayı büyütmeye başlar.
    - en: The delay lowers the loop gain until the joint can no longer reach the target.
      tr: Gecikme döngü gain'ini, eklem artık hedefe ulaşamayacak kadar düşürür.
    - en: The 1 kHz physics step becomes too coarse beyond 40 ms.
      tr: 1 kHz'lik physics adımı 40 ms'nin ötesinde fazla kaba kalır.
  answer: 0
  why:
    en: 'Part A: predicted 49.5 ms, measured stable at 48 ms and unstable at 49 ms, oscillating with the predicted period (272 ms vs 273 ms). A delay changes phase, not gain.'
    tr: 'A bölümü: tahmin 49,5 ms; ölçümde 48 ms kararlı, 49 ms kararsız ve salınım tahmin edilen periyotta (273 ms''ye karşı 272 ms). Gecikme gain''i değil fazı değiştirir.'
- q:
    en: In Break it the delay is fixed at 30 ms and Kp is raised at the same damping ratio ζ = 0.7. Why does the loop diverge at Kp = 80?
    tr: Boz bölümünde gecikme 30 ms'de sabit ve Kp aynı damping ratio ζ = 0,7'de artırılıyor. Döngü neden Kp = 80'de ıraksıyor?
  options:
    - en: A higher Kp at constant ζ means less damping, so it overshoots more.
      tr: Sabit ζ'de daha yüksek Kp daha az damping demektir, bu yüzden daha çok overshoot yapar.
    - en: A stiffer loop has a higher crossover frequency, so the same 30 ms costs more phase; its delay margin falls to 24.7 ms.
      tr: Daha sert bir döngünün crossover frekansı daha yüksektir, bu yüzden aynı 30 ms daha fazla faza mal olur; delay margin'i 24,7 ms'ye düşer.
    - en: The torque limit is reached at Kp = 80.
      tr: Kp = 80'de torque sınırına ulaşılır.
  answer: 1
  why:
    en: 'Break it table: $\omega_c$ 22.99 → 45.97 rad/s and $d_{\max}$ 49.5 → 24.7 ms from Kp 20 to 80; the formula predicts both failing rows (24.7 and 17.5 ms are below 30 ms).'
    tr: 'Boz tablosu: Kp 20''den 80''e $\omega_c$ 22,99 → 45,97 rad/s ve $d_{\max}$ 49,5 → 24,7 ms; formül başarısız iki satırı da öngörüyor (24,7 ve 17,5 ms, 30 ms''nin altında).'
- q:
    en: At 40 ms of delay, prediction with an exact model brings overshoot from 31.23% back to 4.45%. With a model whose inertia is 30% too low it gives 9.44%. What does that tell you?
    tr: 40 ms gecikmede tam doğru bir modelle tahmin, overshoot'u %31,23'ten %4,45'e geri getiriyor. Inertia'sı %30 düşük bir modelle %9,44 veriyor. Bu size ne söyler?
  options:
    - en: Prediction removes any delay, whatever model it uses.
      tr: Tahmin, hangi modeli kullanırsa kullansın her gecikmeyi siler.
    - en: Prediction is useless unless the model is exact.
      tr: Model tam doğru değilse tahmin işe yaramaz.
    - en: Prediction is exact only when the model and the delay are; a wrong model still helps here but changes the closed-loop response.
      tr: Tahmin yalnızca model ve gecikme doğruysa tamdır; yanlış bir model burada yine de yardım eder ama kapalı döngü tepkisini değiştirir.
  answer: 2
  why:
    en: 'Part C table: inertia +50% gives 0.00% overshoot, −30% gives 9.44%, an assumed delay of 20 ms (true 40) gives 4.70%. Knowing the delay and the dynamics (lesson 38) makes prediction safe.'
    tr: 'C bölümü tablosu: inertia +%50 %0,00 overshoot, −%30 %9,44, varsayılan 20 ms gecikme (gerçek 40) %4,70 veriyor. Gecikmeyi ve dinamiği bilmek (ders 38) tahmini güvenli yapar.'
