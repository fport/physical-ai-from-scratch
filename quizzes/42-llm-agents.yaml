# Lesson 42 · LLM agents with robot tools. Every answer is supported by the lesson page,
# experiments/42-llm-agents/output.txt or build_output.txt. answer = index of the correct option (0-based).
- stage: pre
  q:
    en: You expose a robot arm to a language model as tools. Where should the check "is this target above the table and reachable?" live?
    tr: Bir robot kolunu bir dil modeline tool olarak açıyorsun. "Bu hedef masanın üstünde ve erişilebilir mi?" kontrolü nerede olmalı?
  options:
    - en: In the system prompt, so the model knows the limits.
      tr: Sistem prompt'unda, model limitleri bilsin diye.
    - en: In the model's own reasoning, after it calls the tool.
      tr: Modelin kendi akıl yürütmesinde, tool'u çağırdıktan sonra.
    - en: In the tool layer next to the hardware, as ordinary deterministic code that answers a bad call with an error.
      tr: Donanımın yanındaki tool katmanında, kötü bir çağrıyı hatayla yanıtlayan sıradan deterministik kod olarak.
  answer: 2
  why:
    en: 'Core idea: the model proposes, the tool layer validates and executes, the harness measures. With validation, peak table force was 0.00 N in every episode (145.11 N without).'
    tr: 'Ana fikir: model önerir, tool katmanı doğrular ve yürütür, harness ölçer. Validation ile masaya uygulanan en yüksek kuvvet her episode''da 0,00 N (validation olmadan 145,11 N).'
- stage: pre
  q:
    en: The agent calls report_result(success=true). How should the harness decide whether the task was done?
    tr: Agent report_result(success=true) çağırıyor. Harness görevin yapılıp yapılmadığına nasıl karar vermeli?
  options:
    - en: By measuring the world (simulator state or sensors) against the original request, never by reading the claim.
      tr: Dünyayı (simülatör durumu ya da sensörler) orijinal isteğe göre ölçerek; iddiayı okuyarak asla.
    - en: By trusting the claim, since the model saw the tool results.
      tr: İddiaya güvenerek, çünkü model tool sonuçlarını gördü.
    - en: By asking the model a second time.
      tr: Modele ikinci kez sorarak.
  answer: 0
  why:
    en: Without validation, qwen2.5:7b claimed success in all 14 episodes, 8 of them false.
    tr: Validation olmadan qwen2.5:7b 14 episode'un hepsinde başarı iddia etti, 8'i yanlış.
- stage: check
  q:
    en: In Build it, Step 3, the command "move to x = 0.2 m, y = 0.05 m, z = 0.15 m" passed unconverted as move_to(0.2, 0.05, 0.15) passes every schema check. What stops it?
    tr: Sıfırdan yaz, Adım 3'te "x = 0,2 m, y = 0,05 m, z = 0,15 m'ye git" komutu çevrilmeden move_to(0.2, 0.05, 0.15) olarak geçince her şema kontrolünden geçiyor. Onu ne durduruyor?
  options:
    - en: Nothing; the arm moves to the base.
      tr: Hiçbir şey; kol tabana gider.
    - en: The physical contract, which runs before IK; z = 0.15 cm is below the 2.0 cm minimum.
      tr: IK'dan önce çalışan fiziksel sözleşme; z = 0,15 cm, 2,0 cm'lik minimumun altında.
    - en: The JSON-Schema check, because the numbers are too small.
      tr: JSON-Schema kontrolü, çünkü sayılar çok küçük.
  answer: 1
  why:
    en: Valid types say nothing about units or safety. In the Experiment both models converted 0.2 m to 20 cm in every run, so the contract was not needed there.
    tr: Geçerli tipler birim ya da güvenlik hakkında bir şey söylemez. Deney'de iki model de 0,2 m'yi her koşuda 20 cm'ye çevirdi, yani orada sözleşmeye gerek kalmadı.
- stage: check
  q:
    en: Build it, Step 4 replays the 54 tool calls of the 28 validation-ON episodes through our ToolLayer and agrees with the Experiment on 54/54. Why can such a test run without any language model?
    tr: Sıfırdan yaz, Adım 4, 28 validation-ON episode'unun 54 tool çağrısını ToolLayer'ımızdan geçiriyor ve Deney'le 54/54 uyuşuyor. Böyle bir test neden hiç dil modeli olmadan koşabiliyor?
  options:
    - en: Because the transcripts were generated by our code.
      tr: Çünkü transkriptler bizim kodumuzla üretildi.
    - en: Because Ollama was deterministic at temperature 0.
      tr: Çünkü Ollama temperature 0'da deterministikti.
    - en: Because the layer's verdict depends only on the call and the scene, never on the model; logged calls are enough to test it.
      tr: Çünkü katmanın kararı modele değil yalnızca çağrıya ve sahneye bağlı; onu test etmek için log'lanmış çağrılar yeterli.
  answer: 2
  why:
    en: Validation is ordinary deterministic code; the same IK as lesson 10 (identical residuals in Step 2) and the same thresholds (2 cm, 5 mm) give the same rejections.
    tr: Validation sıradan deterministik koddur; ders 10'unkiyle aynı IK (Adım 2'de aynı residual'lar) ve aynı eşikler (2 cm, 5 mm) aynı reddetmeleri verir.
- stage: post
  q:
    en: Without validation, `qwen2.5:7b` reported success in 14 of 14 episodes, 8 of them false. Read as a sensor for "done", what is that report worth?
    tr: Validation olmadan `qwen2.5:7b` 14 episode'un 14'ünde başarı raporladı, 8'i yanlış. "Yapıldı" için bir sensör olarak okunursa bu rapor ne değerde?
  options:
    - en: It is right most of the time, so it can replace the harness for the feasible commands.
      tr: Çoğu zaman doğru, bu yüzden uygulanabilir komutlar için harness'ın yerini tutabilir.
    - en: Nothing; its precision is 6/14, exactly the share of episodes that were done at all, because it fires every time.
      tr: Hiçbir şey; precision'ı 6/14, yani tam olarak yapılmış episode'ların payı, çünkü her seferinde tetikleniyor.
    - en: It is wrong 8 times, so inverting it gives a good sensor.
      tr: 8 kez yanlış, bu yüzden tersine çevirmek iyi bir sensör verir.
  answer: 1
  why:
    en: Math details, "A claim is a noisy sensor", and Build it, Step 5 (P = 0.43). With validation the same model's precision is 6/8 = 0.75, better but still not a measurement.
    tr: Matematik ayrıntısı, "İddia, noisy bir sensördür", ve Sıfırdan yaz, Adım 5 (P = 0,43). Validation ile aynı modelin precision'ı 6/8 = 0,75; daha iyi ama yine de bir ölçüm değil.
- stage: post
  q:
    en: With validation ON, peak table force was 0.00 N in every episode. Which failure still got through?
    tr: Validation AÇIK iken masaya uygulanan en yüksek kuvvet her episode'da 0,00 N idi. Hangi başarısızlık yine de geçti?
  options:
    - en: Goal substitution; told there is no blue cube, both models picked the red one with a perfectly valid call.
      tr: Hedef ikamesi; mavi küp olmadığı söylenince iki model de kırmızı olanı tamamen geçerli bir çağrıyla aldı.
    - en: Commands in metres instead of centimetres.
      tr: Santimetre yerine metre cinsinden komutlar.
    - en: Targets below the table, which the IK check cannot see.
      tr: IK kontrolünün göremediği, masanın altındaki hedefler.
  answer: 0
  why:
    en: Break it. Validation checks the call, not the intent; the red cube moved 7.19 cm and `qwen2.5:7b` reported success 2/2. Only the harness, judging against the original request, catches it.
    tr: Boz bölümü. Validation çağrıyı kontrol eder, niyeti değil; kırmızı küp 7,19 cm hareket etti ve `qwen2.5:7b` 2/2 başarı raporladı. Bunu yalnızca orijinal isteğe göre değerlendiren harness yakalar.
