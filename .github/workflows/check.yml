name: Check book

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint experiment code
        run: uvx ruff@0.17.0 check .
      - name: Links, lesson files, generated files
        run: uv run --no-project --with pyyaml==6.0.3 python tools/check_book.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Cache MuJoCo Menagerie models
        uses: actions/cache@v4
        with:
          path: .cache/mujoco_menagerie
          key: menagerie-f3b6013
      - name: physai tests (only the libraries they need, no torch)
        run: >
          uv run --no-project --with mujoco==3.17.0 --with numpy==2.5.4 --with scipy==1.18.1
          --with pytest==9.1.1 pytest -q
